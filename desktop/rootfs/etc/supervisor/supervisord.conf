; Supervisord del contenedor del escritorio (PID 1).
; Mantiene viva la sesión KasmVNC/XFCE y el agente HTTP interno.
; Se sobrescribe el archivo de Debian para controlar rutas y logs (stdout).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root
childlogdir=/tmp

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:agent]
command=/usr/bin/python3 -u /opt/clouddesk/agent.py
user=root
priority=1
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:session]
command=/opt/clouddesk/start-session.sh
user=desk
priority=10
autostart=true
autorestart=true
startsecs=6
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=20
environment=HOME="/home/desk",USER="desk",LOGNAME="desk",SHELL="/bin/bash",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-desk"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
