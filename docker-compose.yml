# CloudDesk - escritorio Linux remoto en el navegador
# Uso: docker compose up -d --build
#
# Puertos publicados: SOLO 80/443 en el servicio "edge".
# El escritorio (KasmVNC 8444) y el agente (8099) no se publican nunca.
name: clouddesk

services:
  desktop:
    build:
      context: ./desktop
      args:
        KASMVNC_VERSION: "1.5.2"
    image: clouddesk/desktop:1.5.2
    container_name: clouddesk-desktop
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      RESOLUTION: ${RESOLUTION:-1366x768}
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN requerido}
      VNC_USER: ${VNC_USER:-desk}
      VNC_PASSWORD: ${VNC_PASSWORD:?VNC_PASSWORD requerido}
      KASMVNC_MAX_FPS: ${KASMVNC_MAX_FPS:-30}
      KASMVNC_QUALITY_MIN: ${KASMVNC_QUALITY_MIN:-6}
      KASMVNC_QUALITY_MAX: ${KASMVNC_QUALITY_MAX:-8}
      IDLE_STOP_MINUTES: ${IDLE_STOP_MINUTES:-30}
      CHROMIUM_FLAGS: ${CHROMIUM_FLAGS:-}
    shm_size: ${SHM_SIZE:-1g}
    cpus: ${DESKTOP_CPUS:-1.8}
    mem_limit: ${DESKTOP_MEM_LIMIT:-8g}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=64m,mode=755
    volumes:
      # Perfil de Chromium, descargas, configuración de XFCE y documentos.
      - desktop_home:/home/desk
      - /etc/localtime:/etc/localtime:ro
    networks:
      - core
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,os;r=urllib.request.Request('http://127.0.0.1:8099/health',headers={'X-CloudDesk-Token':os.environ['AGENT_TOKEN']});urllib.request.urlopen(r,timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
    image: clouddesk/api:1
    container_name: clouddesk-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?AUTH_PASSWORD_HASH requerido}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requerido}
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN requerido}
      AGENT_URL: http://desktop:8099
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      REMEMBER_DAYS: ${REMEMBER_DAYS:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      PANEL_ORIGIN: https://${PANEL_HOST:?PANEL_HOST requerido}
      VNC_URL: https://${VNC_HOST:?VNC_HOST requerido}/
      VNC_HOST: ${VNC_HOST:?VNC_HOST requerido}
      APP_VERSION: "1.0.0"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cpus: 0.40
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - core
    depends_on:
      desktop:
        # El panel puede arrancar antes, pero el estado del agente aparecería
        # como "online: false" durante los primeros segundos. Esperar al
        # healthcheck evita ese falso negativo al abrir el panel.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    build:
      context: ./gateway
    image: clouddesk/edge:1
    container_name: clouddesk-edge
    restart: unless-stopped
    environment:
      PANEL_HOST: ${PANEL_HOST:?PANEL_HOST requerido}
      VNC_HOST: ${VNC_HOST:?VNC_HOST requerido}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN requerido}
      VNC_AUTH_B64: ${VNC_AUTH_B64:?VNC_AUTH_B64 requerido}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TZ: ${TZ:-UTC}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot:ro
    cpus: 0.40
    mem_limit: 160m
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - core
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Servicio auxiliar: solo se ejecuta a mano para emitir/renovar certificados.
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot ...
  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  edge:
    driver: bridge
  core:
    driver: bridge

volumes:
  desktop_home:
    name: clouddesk_desktop_home
