# =============================================================================
# CloudDesk - extensión SOLO para la prueba end-to-end.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     up -d --force-recreate desktop
#   node tools/e2e-desktop.mjs --cdp http://127.0.0.1:9222
#
# Publica el puerto de depuración de Chromium (CDP) únicamente en 127.0.0.1
# del host: no queda expuesto a Internet ni al resto de la red local.
# NUNCA lo uses en producción. Al terminar, recrea el escritorio sin este
# archivo: docker compose up -d --force-recreate desktop
# =============================================================================
services:
  desktop:
    environment:
      CLOUDDESK_E2E_DEBUG: "1"
    ports:
      - "127.0.0.1:9222:9222"
